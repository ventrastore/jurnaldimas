<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama - Dimas Arif Fikriawan</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* Animasi Latar Belakang Halus */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, #f8fafc 0%, transparent 50%),
                        radial-gradient(circle at bottom left, #f1f5f9 0%, transparent 50%);
            z-index: -1;
            animation: backgroundShift 20s ease infinite alternate;
        }

        @keyframes backgroundShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-10px, 10px); }
        }

        /* Kontainer Utama dengan Efek 3D & Animasi */
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 50px 35px;
            border-radius: 28px;
            box-shadow: 
                12px 12px 24px rgba(0, 0, 0, 0.08),
                -12px -12px 24px rgba(255, 255, 255, 0.95),
                inset 1px 1px 2px rgba(255, 255, 255, 0.8),
                inset -1px -1px 2px rgba(0, 0, 0, 0.02);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: containerPopUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes containerPopUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Teks Salam & Identitas */
        .salam {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #0f172a;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.4s forwards;
        }

        .identitas {
            font-size: 1.1rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.6s forwards;
        }

        /* Info Waktu */
        .info-waktu {
            font-size: 1rem;
            font-weight: 400;
            color: #334155;
            background: linear-gradient(145deg, #f8fafc, #ffffff);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 40px;
            box-shadow: 
                inset 3px 3px 6px rgba(0, 0, 0, 0.05),
                inset -3px -3px 6px rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 0.8s ease-out 0.8s forwards;
            transition: all 0.3s ease;
        }

        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grup Tombol */
        .tombol-grup {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Gaya Tombol Modern & Animasi */
        .tombol {
            display: inline-block;
            padding: 18px 24px;
            font-size: 1.08rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 18px;
            background: #f1f5f9;
            color: #1e293b;
            position: relative;
            overflow: hidden;
            border: none;
            user-select: none;
            box-shadow: 
                6px 6px 12px rgba(0, 0, 0, 0.08),
                -6px -6px 12px rgba(255, 255, 255, 0.95);
            transition: all 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            transform: translateY(25px);
        }

        /* Animasi masuk bertahap */
        .tombol:nth-child(1) { animation: tombolMasuk 0.7s ease-out 1s forwards; }
        .tombol:nth-child(2) { animation: tombolMasuk 0.7s ease-out 1.2s forwards; }
        .tombol:nth-child(3) { animation: tombolMasuk 0.7s ease-out 1.4s forwards; }
        .tombol:nth-child(4) { animation: tombolMasuk 0.7s ease-out 1.6s forwards; }

        @keyframes tombolMasuk {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Efek saat kursor di atas */
        .tombol:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.1),
                -8px -8px 16px rgba(255, 255, 255, 1);
            color: #0f172a;
        }

        /* Efek saat ditekan */
        .tombol:active {
            transform: translateY(2px);
            box-shadow: 
                inset 5px 5px 10px rgba(0, 0, 0, 0.09),
                inset -5px -5px 10px rgba(255, 255, 255, 0.92);
            background: #e6eaf0;
        }

        /* Responsif */
        @media (max-width: 480px) {
            .container {
                padding: 35px 22px;
                border-radius: 24px;
            }

            .salam {
                font-size: 1.35rem;
            }

            .identitas {
                font-size: 1rem;
            }

            .info-waktu {
                font-size: 0.9rem;
                padding: 10px 16px;
            }

            .tombol {
                font-size: 1rem;
                padding: 15px 20px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="salam" id="teksSalam"></div>
        <div class="identitas">DIMAS ARIF FIKRIAWAN • 24.240.0075</div>
        <div class="info-waktu" id="tampilanWaktu"></div>

        <div class="tombol-grup">
            <a href="jurnal.html" class="tombol">Lihat jurnal anda</a>
            <a href="https://www.cerah.co/" target="_blank" class="tombol">Target Mitra</a>
            <a href="https://journal.unusida.ac.id/index.php/jik/id" target="_blank" class="tombol">Tujuan Alamat Jurnal Anda</a>
            <a href="buktisubmit.html" class="tombol">Bukti Submit Jurnal</a>
        </div>
    </div>

    <script>
        // Nama hari dan bulan dalam Bahasa Indonesia
        const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        // Fungsi perbarui waktu secara real-time
        function perbaruiWaktu() {
            const sekarang = new Date();
            const hari = namaHari[sekarang.getDay()];
            const tanggal = sekarang.getDate();
            const bulan = namaBulan[sekarang.getMonth()];
            const tahun = sekarang.getFullYear();
            const jam = sekarang.getHours().toString().padStart(2, '0');
            const menit = sekarang.getMinutes().toString().padStart(2, '0');
            const detik = sekarang.getSeconds().toString().padStart(2, '0');

            document.getElementById("tampilanWaktu").textContent = 
                `${hari}, ${tanggal} ${bulan} ${tahun} | ${jam}:${menit}:${detik}`;
        }

        // Fungsi salam sesuai jam
        function dapatkanSalam() {
            const jam = new Date().getHours();
            if (jam >= 4 && jam < 11) return "Selamat Pagi";
            if (jam >= 11 && jam < 18) return "Selamat Siang";
            return "Selamat Malam";
        }

        // Jalankan fungsi saat halaman dimuat
        document.getElementById("teksSalam").textContent = `${dapatkanSalam()}`;
        perbaruiWaktu();
        setInterval(perbaruiWaktu, 1000);
    </script>
</body>
</html>
